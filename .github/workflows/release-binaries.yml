name: Release binaries

# Builds the standalone Marmotta executables with `bun build --compile` and attaches them to the
# GitHub release of the tag, together with SHA256SUMS and build provenance attestations.
# Bun cross-compiles every target, but each job runs on a runner matching its target so the
# executable is also tested natively (the musl binaries only run on Alpine, so those two
# are quick-tested inside an Alpine container instead).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            platform: linux-x64
            runner: ubuntu-latest
            smoke: full
          - target: bun-linux-arm64
            platform: linux-arm64
            runner: ubuntu-24.04-arm
            smoke: full
          - target: bun-linux-x64-musl
            platform: linux-x64-musl
            runner: ubuntu-latest
            smoke: alpine
          - target: bun-linux-arm64-musl
            platform: linux-arm64-musl
            runner: ubuntu-24.04-arm
            smoke: alpine
          - target: bun-darwin-x64
            platform: darwin-x64
            runner: macos-15-intel
            smoke: full
          - target: bun-darwin-arm64
            platform: darwin-arm64
            runner: macos-latest
            smoke: full
          - target: bun-windows-x64
            platform: windows-x64
            runner: windows-latest
            smoke: full
            ext: .exe
          - target: bun-windows-arm64
            platform: windows-arm64
            runner: windows-11-arm
            smoke: full
            ext: .exe

    steps:
      # These actions run in the job that produces the artifacts, so they are pinned to commit SHAs
      # like the release job's: a moved tag could otherwise ship binaries built by different code
      # while still carrying valid attestations.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned so release artifacts are reproducible; bump deliberately.
          bun-version: 1.4.3

      - name: Install dependencies
        run: npm ci

      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Build and test
        shell: bash
        # Zig and Deno/Bun are deliberately not installed here: the integration tests that need them
        # skip, and scripts/smoke.mjs below is the end-to-end check for this target. The regular CI
        # matrix sets both up and runs the full suite.
        run: npm test

      - name: Build the Node-API headers archive
        shell: bash
        run: npm run build:headers

      - name: Resolve the executable name
        id: meta
        shell: bash
        run: echo "file=marmotta-v$(node -p "require('./package.json').version")-${{ matrix.platform }}${{ matrix.ext }}" >> "$GITHUB_OUTPUT"

      - name: Build the standalone executable
        shell: bash
        run: node scripts/build-bun.mjs --target ${{ matrix.target }}

      - name: Smoke test (native)
        if: matrix.smoke == 'full'
        shell: bash
        run: node scripts/smoke.mjs "out/${{ steps.meta.outputs.file }}"

      - name: Smoke test (Alpine container)
        if: matrix.smoke == 'alpine'
        shell: bash
        # Bun's musl executables link libstdc++ dynamically, which a stock Alpine image does not
        # ship; the image is pinned so the smoke test is reproducible.
        run: |
          image=alpine:3.22
          prepare='apk add --no-cache libstdc++ libgcc > /dev/null'
          file="/out/${{ steps.meta.outputs.file }}"
          expected="marmotta $(node -p "require('./package.json').version")"
          actual="$(docker run --rm -v "$PWD/out:/out:ro" "$image" sh -c "$prepare && exec $file --version")"
          if [ "$actual" != "$expected" ]; then
            echo "expected '$expected', got '$actual'" >&2
            exit 1
          fi
          docker run --rm -v "$PWD/out:/out:ro" "$image" sh -c "$prepare && exec $file --help > /dev/null"

      - name: Upload executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marmotta-${{ matrix.platform }}
          path: out/marmotta-*
          if-no-files-found: error

  release:
    name: Publish release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Only this job writes to the repository and creates the attestations; the build jobs that run
    # the test suite and the build scripts keep read-only access.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # This job only collects build artifacts and publishes them; it does not run repository
      # scripts, so it needs no checkout. Its actions are pinned to commit SHAs rather than movable
      # tags because it has write and OIDC permissions.
      - name: Download executables
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum marmotta-* > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: dist/*

      - name: Attach to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*
          generate_release_notes: true

  # Packaging runs after the binaries are published so that an nfpm download or package build
  # failure cannot block the release itself; the packages are attached to the same release.
  packaging:
    name: Build and publish packages
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The packaging scripts run in a contents: write job; nothing here needs git auth, so do
          # not leave GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up packaging tools
        uses: ./.github/actions/setup-packaging

      - name: Verify the tag matches package.json
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" \
            --dir dist \
            --clobber \
            --pattern 'SHA256SUMS' \
            --pattern 'marmotta-v*-linux-*' \
            --pattern 'marmotta-v*-darwin-*' \
            --pattern 'marmotta-v*-windows-*'

      - name: Test package generation
        env:
          NFPM: /usr/local/bin/nfpm
        run: node --test test/packaging.test.js

      - name: Build distro packages and recipes
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          node scripts/packages.mjs \
            --version "$version" \
            --sums dist/SHA256SUMS \
            --artifacts dist \
            --out packages \
            --build
          (cd packages/artifacts && sha256sum marmotta* > SHA256SUMS.packages)
          cp packages/manifest.json packages/recipes/manifest.json
          GZIP=-n tar \
            --sort=name \
            --mtime="@${SOURCE_DATE_EPOCH}" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf "packages/marmotta-v${version}-packaging.tar.gz" \
            -C packages/recipes .

      - name: Attest package provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            packages/artifacts/*
            packages/marmotta-v*-packaging.tar.gz

      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$GITHUB_REF_NAME"
          packages/artifacts/*
          packages/marmotta-v*-packaging.tar.gz
          --clobber
