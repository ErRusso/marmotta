name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Zig
        # No Node 24 release of setup-zig exists yet (v2.2.1 still declares node20), so GitHub runs it on
        # Node 24 with a deprecation warning; bump it once upstream ships one.
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install nfpm and package verification tools
        # Pinned so package generation is reproducible; bump deliberately together with
        # scripts/packages.mjs and the release workflow.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm zstd
          version=2.43.0
          archive="nfpm_${version}_Linux_x86_64.tar.gz"
          curl -fsSLo "/tmp/$archive" "https://github.com/goreleaser/nfpm/releases/download/v${version}/$archive"
          echo "a80d5f724ed70b192ffa8a2bde469c013cef559c8afa3441eb51dd9a918beb6b  /tmp/$archive" | sha256sum -c -
          sudo tar -xzf "/tmp/$archive" -C /usr/local/bin nfpm
          nfpm --version

      - name: Test package generation and native packages
        env:
          NFPM: /usr/local/bin/nfpm
        run: node --test test/packaging.test.js
