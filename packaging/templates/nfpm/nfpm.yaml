name: marmotta
arch: {{NFPM_ARCH}}
platform: linux
version: {{VERSION}}
section: devel
priority: optional
maintainer: "{{MAINTAINER}}"
description: "{{DESCRIPTION}}"
vendor: napi-bindings
homepage: {{REPOSITORY}}
license: Apache-2.0
overrides:
  deb:
    depends:
      - libc6
  rpm:
    depends:
      - glibc
  apk:
    depends:
      - musl
      - libstdc++
      - libgcc
  archlinux:
    depends:
      - glibc
contents:
  - src: {{BINARY}}
    dst: /usr/bin/marmotta
    file_info:
      mode: 0755
  - src: {{LICENSE_FILE}}
    dst: /usr/share/doc/marmotta/copyright
    file_info:
      mode: 0644
